<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title> CAMARITA DE FOTOS </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">CAMARITA DE FOTOS</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-grid>
    <ion-row>
      @for (photo of photoService.photos(); track photo.filepath; let position = $index) {
      <ion-col size="6">
        <!-- evento click para llamar a showActionSheet y enviar la posición -->
        <img [src]="photo.webviewPath" [attr.alt]="'Photo ' + (position + 1)" loading="lazy" (click)="showActionSheet(photo, position)" />
      </ion-col>
      }
    </ion-row>
  </ion-grid>

  <ion-fab vertical="bottom" horizontal="center" slot="fixed">
    <ion-fab-button (click)="addPhotoToGallery()">
      <ion-icon name="camera"></ion-icon>
    </ion-fab-button>
  </ion-fab>

  <div class="mensajito">
    <h1><strong>¡SONRÍE :)!</strong></h1>
  </div>

</ion-content>
