<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Compra</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-card>
    <ion-card-header>
      <ion-card-title>Registrar compra</ion-card-title>
      <ion-card-subtitle>
        Ingresa los datos del producto
      </ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      <form (ngSubmit)="registrarCompra()">

        <ion-item>
          <ion-input
            label="Nombre del producto"
            labelPlacement="stacked"
            [(ngModel)]="nombre"
            name="nombre"
            placeholder="Ej. Cuaderno">
          </ion-input>
        </ion-item>

        <ion-item>
          <ion-input
            label="Cantidad"
            labelPlacement="stacked"
            type="number"
            [(ngModel)]="cantidad"
            name="cantidad"
            placeholder="Ej. 3">
          </ion-input>
        </ion-item>

        <ion-item>
          <ion-input
            label="Precio unitario"
            labelPlacement="stacked"
            type="number"
            [(ngModel)]="precio"
            name="precio"
            placeholder="Ej. 2.50">
          </ion-input>
        </ion-item>

        <ion-button
          expand="block"
          type="submit"
          class="ion-margin-top">
          Calcular subtotal
        </ion-button>

      </form>
    </ion-card-content>
  </ion-card>

</ion-content>
